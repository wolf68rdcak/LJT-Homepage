locale: en-US
site_theme: default
title: Junteng Liu
title_separator: '-'
name: Junteng Liu
description: 'Natural language processing, machine learning, and large language models.'
url: https://wolf68rdcak.github.io
baseurl: /LJT-Homepage
repository: wolf68rdcak/LJT-Homepage
author:
  avatar: https://github.com/Vicent0205.png
  name: Junteng Liu
  bio: 'Ph.D. candidate in Computer Science'
  employer: HKUST NLP Group
  email: jliugi@connect.ust.hk
  googlescholar: https://scholar.google.com/citations?user=tbK9jl4AAAAJ
  github: Vicent0205
  twitter: junteng88716710
breadcrumbs: false
words_per_minute: 160
future: true
read_more: disabled
talkmap_link: false
comments:
  provider:
atom_feed:
  hide: true
analytics:
  provider: 'false'
include: [.htaccess, _pages]
exclude:
  - .bundle
  - .github
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Dockerfile
  - Gemfile
  - LICENSE
  - node_modules
  - package.json
  - README.md
  - AGENTS.md
  - tmp
  - vendor
  - files
  - markdown_generator
  - talkmap
  - talkmap_out.ipynb
  - _posts
  - _publications
  - _talks
  - _teaching
  - _portfolio
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
defaults:
  - scope:
      path: ''
      type: pages
    values:
      layout: single
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC
plugins: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]
whitelist: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]
compress_html:
  clippings: all
  ignore:
    envs: development
